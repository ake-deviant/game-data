name: Tag merged version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Studio dependencies
        run: npm ci --prefix studio

      - name: Validate production data
        run: npm run validate:data

      - name: Test Studio
        run: npm test --prefix studio

      - name: Typecheck Studio
        run: npm run typecheck --prefix studio

      - name: Build Studio
        run: npm run build --prefix studio

      - name: Build legacy editor
        run: npm test

      - name: Tag package version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG existe déjà, aucun nouveau tag nécessaire."
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
