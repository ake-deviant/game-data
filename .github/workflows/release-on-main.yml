name: Create patch version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Studio dependencies
        run: npm ci --prefix studio

      - name: Validate production data
        run: npm run validate:data

      - name: Test Studio
        run: npm test --prefix studio

      - name: Typecheck Studio
        run: npm run typecheck --prefix studio

      - name: Build Studio
        run: npm run build --prefix studio

      - name: Build legacy editor
        run: npm test

      - name: Create patch commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore(release): %s [skip ci]"
          git push origin HEAD:main --follow-tags
