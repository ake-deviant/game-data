name: Open Studio pull request

on:
  push:
    branches:
      - studio/publish-*

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          existing_pr=$(gh pr list --base main --head "$HEAD_BRANCH" --state open --json url,isCrossRepository --jq 'map(select(.isCrossRepository | not)) | .[0].url // empty')
          if [[ -n "$existing_pr" ]]; then
            printf "Pull request already open: %s\n" "$existing_pr"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$HEAD_BRANCH" \
            --title "feat(data): update production game data" \
            --body "Proposition générée et validée depuis Game Data Studio."
